[package]
name = "timecurrency-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Devnet-only Rust application foundation for the time currency protocol"

[lib]
name = "timecurrency_node"
path = "src/lib.rs"

[[bin]]
name = "time-node"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
prost = "0.13"
redb = "=4.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tendermint-abci = "=0.40.4"
tendermint-proto = "=0.40.4"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
overflow-checks = true
lto = "thin"
strip = "debuginfo"
