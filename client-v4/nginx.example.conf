# Private staging candidate. Provision certificates independently; this file
# neither obtains nor installs certificates and does not enable valuable funds.
# Start createV4Servers with explicit matching publicOrigins and fixed loopback
# ports. No X-Forwarded-* value is used as an application trust decision.
#
# Each client is held to a rate of its own here, sized for a household or an
# office behind one address (six wallets opening, unlocking, signing up and
# paying at once asked 85 requests of the gateway within 3 seconds; twenty
# people opening the wallet ask about 720 files), as the test network's proxy
# does (testnet/proxy.mjs). nginx keys by address; one IPv6 host has a /64 of
# them, which that proxy counts as one.
#
# Give the gateway "trusted_proxies": ["127.0.0.1"] (deploy/gateway/README.md)
# with this file: it then reads the X-Forwarded-For written below, for its
# limits only, counts each client apart and serves their checks fairly.
# Without it the gateway cannot tell clients apart and takes 50 requests a
# second from everybody together, which one client at these rates can use up.
# X-Forwarded-For must be $remote_addr, written here, never a client's own
# header passed on ($proxy_add_x_forwarded_for would): anyone could then
# choose the address they are counted as.
map "$request_method:$uri" $time_work_key {
    ~^GET:/api/  $binary_remote_addr;
    ~^GET:       "";
    default      $binary_remote_addr;
}
map $time_work_key $time_file_key {
    ""       $binary_remote_addr;
    default  "";
}
limit_req_zone $time_work_key zone=time_work:10m rate=10r/s;
limit_req_zone $time_file_key zone=time_files:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=time_open:10m;
limit_req_status 429;
limit_conn_status 429;
server {
    listen 443 ssl;
    server_name wallet.example;
    ssl_certificate /etc/time/tls/wallet-fullchain.pem;
    ssl_certificate_key /etc/time/tls/wallet-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != wallet.example) { return 444; }
    client_max_body_size 768k;
    client_body_timeout 30s;
    limit_conn time_open 256;
    location / {
        limit_req zone=time_work burst=200 nodelay;
        limit_req zone=time_files burst=800 nodelay;
        proxy_pass http://127.0.0.1:8907;
        proxy_http_version 1.1;
        proxy_set_header Host wallet.example;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # The alert service (deploy/alerts/README.md), when it runs: the wallet's
    # page reaches it under the wallet's own name. It counts its callers by
    # X-Forwarded-For from this proxy (its trusted_proxies), written here.
    # location /alerts/ {
    #     limit_req zone=time_work burst=200 nodelay;
    #     proxy_pass http://127.0.0.1:8950;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host wallet.example;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    # }
}
server {
    listen 443 ssl;
    server_name app.example;
    ssl_certificate /etc/time/tls/app-fullchain.pem;
    ssl_certificate_key /etc/time/tls/app-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != app.example) { return 444; }
    client_max_body_size 768k;
    client_body_timeout 30s;
    limit_conn time_open 256;
    location / {
        limit_req zone=time_work burst=200 nodelay;
        limit_req zone=time_files burst=800 nodelay;
        proxy_pass http://127.0.0.1:8908;
        proxy_http_version 1.1;
        proxy_set_header Host app.example;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
