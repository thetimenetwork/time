# Private staging candidate. Provision certificates independently; this file
# neither obtains nor installs certificates and does not enable valuable funds.
# Start createV4Servers with explicit matching publicOrigins and fixed loopback
# ports. No X-Forwarded-* value is used as an application trust decision.
server {
    listen 443 ssl;
    server_name wallet.example;
    ssl_certificate /etc/time/tls/wallet-fullchain.pem;
    ssl_certificate_key /etc/time/tls/wallet-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != wallet.example) { return 444; }
    client_max_body_size 768k;
    location / {
        proxy_pass http://127.0.0.1:8907;
        proxy_http_version 1.1;
        proxy_set_header Host wallet.example;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
    }
}
server {
    listen 443 ssl;
    server_name app.example;
    ssl_certificate /etc/time/tls/app-fullchain.pem;
    ssl_certificate_key /etc/time/tls/app-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != app.example) { return 444; }
    client_max_body_size 768k;
    location / {
        proxy_pass http://127.0.0.1:8908;
        proxy_http_version 1.1;
        proxy_set_header Host app.example;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
    }
}
