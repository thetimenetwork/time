# Run a reviewed collector in the private validator network namespace, or reach
# these loopback endpoints over an authenticated operator tunnel. No public bind.
global:
  scrape_interval: 10s
rule_files: [/opt/time/deploy/alerts.yaml]
scrape_configs:
  - job_name: time-private-operator
    static_configs:
      - targets: [127.0.0.1:26661]
  - job_name: comet-private-validator
    static_configs:
      - targets: [127.0.0.1:26660]
