[package]
name = "time-history"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded authenticated canonical history with untrusted append archive"
[features]
default = ["archive"]
archive = []
[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.154"
