[package]
name = "time-pos"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deterministic stake escrow and bounded validator transition rules for protocol 4 development networks"

[dependencies]
anyhow = "1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
hex = "=0.4.3"
ed25519-dalek = "=3.0.0"
tendermint = "=0.40.4"

[profile.release]
overflow-checks = true
