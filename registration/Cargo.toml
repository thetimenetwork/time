[package]
name = "time-registration"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deterministic paid sponsored registration and bounded expiry queues"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
