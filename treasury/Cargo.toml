[package]
name = "time-treasury-policy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline prototype for independently authorized Bitcoin treasury destination rotation"

[dependencies]
anyhow = "1"
bitcoin = { version = "=0.32.102", features = ["serde"] }
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[profile.release]
overflow-checks = true
