[package]
name = "timecurrency-v2"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Development-only incremental authenticated state and compact proofs"

[features]
fixtures = []

[lib]
name = "timecurrency_v2"
path = "src/lib.rs"

[[bin]]
name = "time-node-v2"
path = "src/main.rs"

[[bin]]
name = "time-scale-v2"
path = "src/scale.rs"
required-features = ["fixtures"]

[dependencies]
anyhow = "1"
base64 = "=0.22.1"
borsh = { version = "=1.8.1", features = ["derive"] }
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
jmt = { version = "=0.12.0", default-features = false, features = ["std", "sha2"] }
prost = "0.13"
redb = "=4.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sha2_10 = { package = "sha2", version = "=0.10.9" }
tendermint-abci = "=0.40.4"
tendermint-proto = "=0.40.4"
timecurrency-node = { path = ".." }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
overflow-checks = true
lto = "thin"
strip = "debuginfo"
