[package]
name = "timecurrency-verifier-v4"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tendermint = "=0.40.4"
tendermint-light-client-verifier = "=0.40.4"
wasm-bindgen = "=0.2.130"

jmt = { version = "=0.12.0", default-features = false, features = ["std", "sha2"] }
sha2_10 = { package = "sha2", version = "=0.10.9" }

history = { package = "time-history", path = "../history", default-features = false }

[dev-dependencies]
anyhow = "=1.0.104"
jmt = { version = "=0.12.0", default-features = false, features = ["std", "sha2", "mocks"] }

ed25519-dalek = "=3.0.0"

[profile.release]
# Arithmetic overflow stops verification instead of wrapping.
overflow-checks = true
